<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>物件新規登録確認 [MOCK]</title></head><body>
<h3>入力内容確認</h3>
<div id="out">読み込み中</div>
<!-- ★実機の「登録」もDIV＋スプライト（8/12はテキストで見つからず座標クリックしていた） -->
<!-- ★実機は <img id="jikko" class="imageButton" alt="登録"> で title/value/テキストは空。
     文字で探しても見つからない（8/12は座標クリックしていた）。alt が唯一の手掛かり。 -->
<img id="teisei" class="imageButton" alt="訂正" width="120" height="25"
     src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
     onclick="history.back()">
<img id="jikko" class="imageButton" alt="登録" width="120" height="34"
     src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
     onclick="doReg()">
<script>
var r = JSON.parse(sessionStorage.getItem('mock_result') || '{}');
document.getElementById('out').innerHTML =
  '<div id="res_bukkenNm">' + (r.bukkenNm||'') + '</div>' +
  '<div id="res_registered">' + (r.registered||[]).join(',') + '</div>' +
  '<div id="res_dropped">' + (r.dropped||[]).join(',') + '</div>' +
  '<div id="res_tokucho">' + (r.tokucho||[]).join(',') + '</div>' +
  '<div id="res_score">' + (r.score||'') + '</div>' +
  '<div id="res_transit">' + (r.transit||'') + '</div>' +
  '<p>登録画像 ' + (r.registered||[]).length + '枚 / \u2605未登録(サムネ未表示) ' + (r.dropped||[]).length + '枚</p>';
function doReg() {
  // 12桁の物件コードを払い出す（実機の完了画面の表記に合わせる）
  var code = '4' + String(Math.abs(hash(r.bukkenNm||'x'))).padStart(11,'0').slice(0,11);
  sessionStorage.setItem('mock_code', code);
  location.href = 'done.html';
}
function hash(s){ var h=0; for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;} return h; }
</script></body></html>

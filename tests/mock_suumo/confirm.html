<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>確認画面 [MOCK]</title></head><body>
<h3>確認画面（モック）</h3>
<div id="out">読み込み中</div>
<script>
var r = JSON.parse(sessionStorage.getItem('mock_result') || '{}');
document.getElementById('out').innerHTML =
  '<div id="res_bukkenNm">' + (r.bukkenNm||'') + '</div>' +
  '<div id="res_registered">' + (r.registered||[]).join(',') + '</div>' +
  '<div id="res_dropped">' + (r.dropped||[]).join(',') + '</div>' +
  '<div id="res_tokucho">' + (r.tokucho||[]).join(',') + '</div>' +
  '<div id="res_score">' + (r.score||'') + '</div>' +
  '<div id="res_transit">' + (r.transit||'') + '</div>' +
  '<p>登録画像 ' + (r.registered||[]).length + '枚 / ★未登録(サムネ未表示) ' + (r.dropped||[]).length + '枚</p>';
</script></body></html>
